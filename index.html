<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Alert 2 - Vite + TypeScript</title>
    <style>
        body {
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        div#loader {
            margin: 0 0 0 0;
            padding: 0 0 0 0;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0px;
            left: 0px;
            background-image: url(/IMG/background.jpg);
            background-position: center;
            background-size: auto;
            background-repeat: no-repeat;
            background-color: black;
        }

        div#loader progress {
            position: absolute;
            align-self: center;
            width: 400px;
            height: 30px;
            left: calc(50% - 200px);
            top: calc(50% + 130px);
        }
    </style>
    <!-- Load SoundJS before main script -->
    <script src="/lib/soundjs.min.js"></script>
</head>
<body>
    <div id="loader">
        <progress value="0" max="100"></progress>
    </div>
    
    <!-- Vite will inject the script here -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
