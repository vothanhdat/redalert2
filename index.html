<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Red Alert 2</title>

    <!--
      PIXI now comes from npm. These two remain classic scripts publishing window
      globals: SoundJS is only reachable as `createjs`, and jQuery is needed by the
      inline handlers inside the runtime-injected HTML fragments under JS/UI/.
    -->
    <script src="/Scripts/soundjs-0.6.2.min.js"></script>
    <script src="/Scripts/jquery-2.1.4.min.js"></script>

    <script type="module" src="/src/main.ts"></script>

    <style>
        body {
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        div#loader {
            margin: 0 0 0 0;
            padding: 0 0 0 0;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0px;
            left: 0px;
            background-image: url(/IMG/background.jpg);
            background-position: center;
            background-size: auto;
            background-repeat: no-repeat;
            background-color: black;
        }

            div#loader progress {
                position: absolute;
                align-self: center;
                width: 400px;
                height: 30px;
                left: calc(50% - 200px);
                top: calc(50% + 130px);
            }
    </style>
</head>

<body>
    <div id="loader">
        <progress value="0" max="100">
        </progress>
    </div>
</body>

</html>
