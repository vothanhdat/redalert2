<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>

    <script src="Scripts/pixi.js"></script>
    <script src="Scripts/soundjs-0.6.2.min.js"></script>
    <script src="Scripts/jquery-2.1.4.min.js"></script>
    <script src="Scripts/JavaScript_helper.js"></script>

</head>

<body>
    <style>
        body {
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        div#loader {
            margin: 0 0 0 0;
            padding: 0 0 0 0;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0px;
            left: 0px;
            background-image: url(IMG/background.jpg);
            background-position: center;
            background-size: auto;
            background-repeat: no-repeat;
            background-color: black;
        }

            div#loader progress {
                position: absolute;
                align-self: center;
                width: 400px;
                height: 30px;
                left: calc(50% - 200px);
                top: calc(50% + 130px);
            }
    </style>
    <div id="loader">
        <progress value="0" max="100">
        </progress>

    </div>
    <!--<div id="listener"></div>

    <div id="log"></div>-->

    <script type="module" src="/src/main.js"></script>
</body>

</html>
